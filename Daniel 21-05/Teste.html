<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprendendo a usar o GitHub</title>

    <style>
        /* RESET */
        * {
            margin: 10;
            padding: 10;
            box-sizing: border-box;
        }

        /* BODY */
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f4f4;
            color: #333;
        }

        /* HEADER */
        header {
            background-color: #111;
            color: white;
            padding: 20px;
            text-align: center;
        }

        /* NAV */
        nav {
            background-color: #222;
            padding: 10px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            transition: 0.3s;
        }

        nav a:hover {
            color: #00bfff;
        }

        /* MAIN */
        main {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
        }

        /* CARD */
        .card {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        /* BUTTON */
        button {
            background-color: #00bfff;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #0099cc;
        }

        /* FOOTER */
        footer {
            background-color: #111;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Bem-Vindos ao site</h1>
        <p>Eduardo - ATV</p>
    </header>

    <nav>
        <a href="#">Início</a>
        <a href="#">Sobre</a>
        <a href="#">Contato</a>
    </nav>

    <main>

        <section class="card">
            <h2>Título da seção</h2>
            <p>
                Aqui você pode começar a montar seu conteúdo.
            </p>

            <br>

            <button>Clique aqui</button>
        </section>

        <section class="card">
            <h2>Outra seção</h2>
            <p>
                Você pode duplicar cards e ir criando layouts.
            </p>
        </section>

    </main>

    <footer>
        <p>© 2026 - Meu Projeto</p>
    </footer>

</body>
</html>
